name: violet_chat
description: "Violet Chat — تطبيق مراسلة Android بهوية بنفسجية، مراسلة مشفرة طرف-لطرف مع Firebase Authentication وCloud Firestore"
publish_to: 'none'

# v0.1.3 — تشخيص صادق لفشل Google ميدانياً + تحصين التدفق:
# 1) serverClientId صريح بدل الاعتماد على مورد الجهاز (يزيل نمط فشل كامل).
# 2) حارس idToken صريح قبل تبادل Firebase.
# 3) رسالة الفشل المجهول تحمل رمز الخطأ الفعلي — لقطة شاشة = تشخيص فوري
#    (الرسالة العامة القديمة «تحقق من البيانات والاتصال» أخفت السبب).
# 4) تمييز فشل جلسة المراسلة (بعد نجاح Google) عن فشل Google نفسه.
# versionCode 10: الإصدار المنشور السابق (v0.1.2) حمل code 9.
# v0.1.5 (code 12) — v0.1.4 (code 11): رسالة تنفيذية لـpermission-denied،
# ثم استخراج رقم ApiException الحقيقي بدل رسالة SHA-1 المضللة لكل الأعطال.
# v0.1.9 (code 16) — v0.1.8 (code 15): إضافة بالباركود + فحص التحديث
# داخل التطبيق + حجم خط المحادثة + معلومات الرسالة في الثنائية.
# v0.1.10 (code 17): استطلاعات رأي مشفرة + حالات/ستوري للأصدقاء —
# جداول violet_story_* جديدة + توسيع قيد messages.kind على الخادم.
# v0.1.11 (code 18): تعديل رسائل الاستطلاع + ردود على الحالات +
# حالات فيديو — توسيع قيد messages.kind لقبول storyReply (رقعة حية).
# v0.1.12 (code 19): مشاركة الموقع المشفرة (GPS/خريطة OSM) + بطاقات
# جهات الاتصال المشفرة + تنسيق نص الرسائل — توسيع قيد messages.kind
# لقبول location/contact (رقعة حية).
version: 0.1.12+19

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Arabic localization (v0.1.0) ---
  # Fixes a real field bug: locale 'ar' was set without any delegate,
  # so every TextField crashed at build ("No MaterialLocalizations
  # found") — the login form rendered as a gray ErrorWidget box and
  # sign-in was impossible on real devices since v0.1.0.
  flutter_localizations:
    sdk: flutter

  # --- Backend (database + auth + realtime + storage) ---
  supabase_flutter: ^2.8.4

  # --- Cryptography (X25519 / Ed25519 / HKDF / AES-256-GCM) ---
  cryptography: ^2.9.0

  # --- Secure on-device key storage ---
  flutter_secure_storage: ^9.2.4

  # --- Local database (offline first) ---
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # --- State management ---
  provider: ^6.1.2

  # --- Connectivity awareness ---
  connectivity_plus: ^6.1.2

  # --- Media picking & recording ---
  image_picker: ^1.1.2
  record: ^6.2.1
  file_picker: ^8.1.7

  # --- Media playback ---
  just_audio: ^0.9.43
  video_player: ^2.9.2
  local_auth: ^2.3.0

  # --- Image thumbnails (pure Dart) ---
  image: ^4.5.2

  # --- Notifications ---
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

  # --- Firebase (نفس مشروع drs-nexora القائم من تكامل FCM — لا تكرار) ---
  # firebase_core + firebase_messaging: دفع النظام (كان قائماً).
  # firebase_auth + cloud_firestore: طبقة هوية Violet Chat (v0.1.0) —
  # المصادقة بالبريد/كلمة المرور + ملف المستخدم users/{uid}.
  # تفعيل الخدمتين يتطلب خطوات Console موثقة في docs/FIREBASE_SETUP.md؛
  # وقت التشغيل يكتشف التوفر ويسقط بأمان إلى تدفق المصادقة القائم.
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.6

  # --- Google Sign-In (v0.1.1) ---
  # زر «المتابعة عبر Google» على شاشة الهوية — الحصول على بيانات
  # اعتماد Google ثم تمريرها إلى firebase_auth (signInWithCredential).
  # 6.x: واجهة مستقرة معروفة (account.authentication → idToken).
  google_sign_in: ^6.2.1

  # --- Calls (WebRTC) ---
  flutter_webrtc: ^0.14.0

  # --- v0.1.12: Location sharing ---
  # flutter_map + latlong2: خريطة OSM بلا مفاتيح API (منتقي + معاينة).
  # geolocator: الموقع الحالي (يتطلب صلاحيات موقع في الـManifest).
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.0

  # --- Utilities ---
  uuid: ^4.5.1
  intl: ^0.20.2
  share_plus: ^10.1.3
  device_info_plus: ^11.3.0
  app_links: ^6.3.2

  # --- v0.1.9: إضافة بالباركود + فحص التحديث داخل التطبيق ---
  # qr_flutter: توليد رمز QR الشخصي (حمولة violetchat://add/<username>).
  # mobile_scanner: مسح رمز الإضافة من جهاز آخر — 5.x متوافق مع
  #   Kotlin 1.9/minSdk 24 القائمين (لا يرفع متطلبات البناء).
  # url_launcher: فتح صفحة الإصدار الجديد عند اكتشاف تحديث.
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
