# Memory tuning — sized to fit CI runners and modest local machines.
# The daemon heap must stay below available RAM or the OOM killer
# terminates the build ("Gradle build daemon disappeared unexpectedly").
# Kotlin runs IN-PROCESS to avoid a separate ~1GB Kotlin daemon JVM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=false
android.builder.sdkDownload=false
