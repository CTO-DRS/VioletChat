name: build-release

# Violet Chat — بناء رسمي موقّع + اختبارات + Release.
# يُطلق يدوياً (workflow_dispatch) أو عند دفع وسم v* (مثل v0.1.0).
# المصدر هو هذا المستودع نفسه (عام) — لا سحب عابر للمستودعات.
# التوقيع من أسرار CI (ANDROID_KEYSTORE_B64 + ANDROID_KEY_PROPERTIES) —
# نفس سلسلة مفتاح الإنتاج الحالية، وحارس آلي يفشل البناء إن خرجت
# الشهادة عن الهوية المتوقعة. لا مفتاح توقيع في الشيفرة أبداً.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter Gradle Plugin 3.35 يطلب NDK 26.1.10909125 وقابس
      # record 6.x يبني عبر CMake 3.22.1 — نثبتهما قبل البناء.
      - name: Install NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          ok=0
          for i in 1 2 3 4; do
            echo "sdkmanager attempt $i..."
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" >/dev/null; then ok=1; break; fi
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "sdkmanager failed after 4 attempts"; exit 1; }
          ls "$ANDROID_HOME/ndk/" "$ANDROID_HOME/cmake/"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.1'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      # التحليل الساكن قبل الاختبارات: يلتقط أخطاء الاستيراد/الأنواع
      # قبل الوصول لمرحلة بناء APK الثقيلة (درس run 39717301418).
      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      # التوقيع من أسرار CI (المستودع عام — لا مفتاح في الشيفرة أبداً):
      # ANDROID_KEYSTORE_B64 (base64 للـjks) + ANDROID_KEY_PROPERTIES.
      - name: Materialize signing config from CI secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_B64" ] || { echo "missing secret: ANDROID_KEYSTORE_B64"; exit 1; }
          [ -n "$ANDROID_KEY_PROPERTIES" ] || { echo "missing secret: ANDROID_KEY_PROPERTIES"; exit 1; }
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/nexora-release.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES" > android/key.properties
          test -s android/app/nexora-release.jks
          grep -q 'keyAlias=nexora' android/key.properties
          echo "release signing: materialized from CI secrets OK"

      # Universal = arm32 + arm64 (بدون x86_64) — تطابق تخطيط المرآة.
      - name: Build universal APK (signed)
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Build split APKs (signed)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      # حارس التوقيع: الشهادة يجب أن تكون هوية الإنتاج الحالية —
      # مفتاح خاطئ يثبّت على أجهزة جديدة لكن يُفشل كل تحديث فوق القديم.
      - name: Stage APKs + signing guard
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk              dist/app-universal-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk    dist/
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk  dist/

          BT="$ANDROID_HOME/build-tools/34.0.0"
          EXPECTED="ae74add09a58f8063ab45e18c1b99e9e1352acf2f46af67789d74f097e44fa6b"

          "$BT/aapt" dump badging dist/app-universal-release.apk | grep -E "^package:|application-label" || true

          for apk in dist/*.apk; do
            CERT="$("$BT/apksigner" verify --print-certs "$apk" \
              | grep 'certificate SHA-256 digest' | head -1 \
              | awk '{print $NF}' | tr -d '[:space:]' | tr 'A-F' 'a-f')"
            echo "$apk -> $CERT"
            if [ "$CERT" != "$EXPECTED" ]; then
              echo "SIGNING GUARD FAILED [$apk]: $CERT != $EXPECTED — DO NOT RELEASE"
              exit 1
            fi
          done
          echo "signing guard OK: production identity confirmed on all 3 APKs"
          cd dist
          sha256sum *.apk | tee SHA256SUMS.txt
          du -h *.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            dist/app-universal-release.apk \
            dist/app-arm64-v8a-release.apk \
            dist/app-armeabi-v7a-release.apk \
            dist/SHA256SUMS.txt \
            --title "Violet Chat ${TAG} — Initial Release" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Upload artifacts (push builds, no tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: violet-chat-apks
          path: dist/*
